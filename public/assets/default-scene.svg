<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" style="stop-color:rgb(20,20,30);stop-opacity:1" />
   <stop offset="100%" style="stop-color:rgb(50,40,60);stop-opacity:1" />
  </linearGradient>
  <filter id="noise" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend mode="overlay" in="SourceGraphic" in2="noise"/>
  </filter>
 </defs>
 <rect width="100%" height="100%" fill="url(#grad1)" filter="url(#noise)" />
 <text x="50%" y="45%" font-family="serif" font-size="40" fill="#665577" text-anchor="middle" font-style="italic">Aether RPG</text>
 <text x="50%" y="55%" font-family="sans-serif" font-size="14" fill="#444455" text-anchor="middle">En attente de l'aventure...</text>
 <circle cx="400" cy="300" r="150" stroke="#332244" stroke-width="2" fill="none" opacity="0.5" />
</svg>


